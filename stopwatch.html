<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로켓 계기판 스톱워치</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #1a2340 0%, #060810 55%, #020204 100%);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    position: relative;
  }

  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .panel {
    position: relative;
    z-index: 1;
    width: 400px;
    max-width: 92vw;
    background: linear-gradient(160deg, #454b54 0%, #2b2f35 45%, #1a1d21 100%);
    border-radius: 22px;
    padding: 22px 24px 20px;
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.7),
      inset 0 2px 0 rgba(255, 255, 255, 0.12),
      inset 0 -3px 6px rgba(0, 0, 0, 0.6);
    border: 2px solid #0c0d0f;
  }

  .rivet {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #d8dadd, #6a6e75 60%, #35373b 100%);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .rivet.tl { top: 12px; left: 12px; }
  .rivet.tr { top: 12px; right: 12px; }
  .rivet.bl { bottom: 12px; left: 12px; }
  .rivet.br { bottom: 12px; right: 12px; }

  .header {
    text-align: center;
    margin-bottom: 12px;
  }

  .title {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #ff9f43;
    text-shadow: 0 0 10px rgba(255, 159, 67, 0.7);
  }

  .stripe {
    height: 6px;
    margin: 8px auto 0;
    width: 90%;
    background: repeating-linear-gradient(45deg, #ffcc33 0 10px, #1a1d21 10px 20px);
    border-radius: 3px;
    opacity: 0.85;
  }

  .gauge-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 10px;
  }

  .gauge-wrap svg {
    width: 220px;
    height: 220px;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.6));
  }

  #needle {
    stroke: #ff5040;
    stroke-width: 3;
    stroke-linecap: round;
    transform-origin: 150px 150px;
    filter: drop-shadow(0 0 4px rgba(255, 80, 64, 0.8));
  }

  .lcd {
    background: linear-gradient(180deg, #10160f, #060906);
    border: 2px solid #05130a;
    border-radius: 10px;
    text-align: center;
    padding: 10px 6px;
    margin-bottom: 14px;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
  }

  .lcd #time, .lcd #ms {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 34px;
    font-weight: 700;
    color: #4dff6a;
    text-shadow: 0 0 6px rgba(77, 255, 106, 0.85), 0 0 16px rgba(77, 255, 106, 0.5);
    letter-spacing: 1px;
  }

  .lcd .ms {
    font-size: 18px;
    color: #2fcf4c;
  }

  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .btn-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .led {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2a2a2a;
    box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.8);
    transition: background 0.2s, box-shadow 0.2s;
  }
  .led.on-green { background: #4dff6a; box-shadow: 0 0 8px #4dff6a; }
  .led.on-red { background: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }
  .led.on-blue { background: #4dc3ff; box-shadow: 0 0 8px #4dc3ff; }
  .led.on-amber { background: #ffb84d; box-shadow: 0 0 8px #ffb84d; }

  button {
    border: none;
    outline: none;
    cursor: pointer;
    width: 76px;
    height: 44px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    border-radius: 10px;
    color: #fff;
    transition: transform 0.12s ease, opacity 0.15s ease;
    box-shadow: 0 4px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  #startBtn { background: linear-gradient(180deg, #4fd66a, #2a9c46); }
  #stopBtn  { background: linear-gradient(180deg, #ff6b5e, #c4342a); }
  #lapBtn   { background: linear-gradient(180deg, #5cb8ff, #2f7fd6); }
  #resetBtn {
    background:
      repeating-linear-gradient(45deg, #2a2a2a 0 6px, #1a1a1a 6px 12px);
    border: 2px solid #ffcc33;
  }

  .laps {
    max-height: 110px;
    overflow-y: auto;
    background: #0c0e10;
    border: 1px solid #33373d;
    border-radius: 8px;
    padding: 6px 10px;
  }

  .laps::-webkit-scrollbar { width: 5px; }
  .laps::-webkit-scrollbar-thumb {
    background: #4a4f57;
    border-radius: 3px;
  }

  .lap-item {
    display: flex;
    justify-content: space-between;
    padding: 4px 2px;
    font-size: 12px;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #a9e8b8;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  .lap-item:last-child { border-bottom: none; }
  .lap-item span:first-child { color: #ff9f43; }

  .laps:empty::after {
    content: "🛰 LAP DATA STANDBY";
    display: block;
    text-align: center;
    color: #55606b;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 4px 0;
  }
</style>
</head>
<body>

<div id="stars"></div>

<div class="panel">
  <div class="rivet tl"></div>
  <div class="rivet tr"></div>
  <div class="rivet bl"></div>
  <div class="rivet br"></div>

  <div class="header">
    <div class="title">🚀 ROCKET CHRONOMETER</div>
    <div class="stripe"></div>
  </div>

  <div class="gauge-wrap">
    <svg viewBox="0 0 300 300">
      <defs>
        <radialGradient id="bezel" cx="50%" cy="45%" r="70%">
          <stop offset="0%" stop-color="#3a3f46"/>
          <stop offset="70%" stop-color="#20242a"/>
          <stop offset="100%" stop-color="#0e1013"/>
        </radialGradient>
      </defs>
      <circle cx="150" cy="150" r="140" fill="url(#bezel)" stroke="#0a0b0d" stroke-width="4"/>
      <circle cx="150" cy="150" r="112" fill="#0b0f12" stroke="#3a3f46" stroke-width="2"/>
      <g id="ticks"></g>
      <line id="needle" x1="150" y1="150" x2="150" y2="52"/>
      <circle cx="150" cy="150" r="7" fill="#ff5040" stroke="#1a1d21" stroke-width="2"/>
    </svg>
  </div>

  <div class="lcd">
    <span id="time">00:00:00</span><span class="ms" id="ms">.00</span>
  </div>

  <div class="buttons">
    <div class="btn-col">
      <div class="led" id="ledStart"></div>
      <button id="startBtn">START</button>
    </div>
    <div class="btn-col">
      <div class="led" id="ledStop"></div>
      <button id="stopBtn" disabled>STOP</button>
    </div>
    <div class="btn-col">
      <div class="led" id="ledLap"></div>
      <button id="lapBtn" disabled>LAP</button>
    </div>
    <div class="btn-col">
      <div class="led" id="ledReset"></div>
      <button id="resetBtn">RESET</button>
    </div>
  </div>

  <div class="laps" id="laps"></div>
</div>

<script>
  // ---- 배경 별 생성 ----
  (function stars() {
    const wrap = document.getElementById('stars');
    for (let i = 0; i < 90; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
      s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
      wrap.appendChild(s);
    }
  })();

  // ---- 게이지 눈금 생성 (0~59초 다이얼) ----
  (function ticks() {
    const g = document.getElementById('ticks');
    const ns = 'http://www.w3.org/2000/svg';
    const cx = 150, cy = 150;
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * 2 * Math.PI - Math.PI / 2;
      const major = i % 5 === 0;
      const rOuter = 108;
      const rInner = major ? 92 : 100;
      const x1 = cx + rOuter * Math.cos(angle);
      const y1 = cy + rOuter * Math.sin(angle);
      const x2 = cx + rInner * Math.cos(angle);
      const y2 = cy + rInner * Math.sin(angle);
      const line = document.createElementNS(ns, 'line');
      line.setAttribute('x1', x1.toFixed(1));
      line.setAttribute('y1', y1.toFixed(1));
      line.setAttribute('x2', x2.toFixed(1));
      line.setAttribute('y2', y2.toFixed(1));
      line.setAttribute('stroke', major ? '#ff9f43' : '#5a6068');
      line.setAttribute('stroke-width', major ? '2.5' : '1');
      g.appendChild(line);

      if (major) {
        const rNum = 78;
        const nx = cx + rNum * Math.cos(angle);
        const ny = cy + rNum * Math.sin(angle);
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('x', nx.toFixed(1));
        text.setAttribute('y', (ny + 4).toFixed(1));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('font-size', '12');
        text.setAttribute('font-family', 'Consolas, monospace');
        text.setAttribute('fill', '#c9cdd2');
        text.textContent = i;
        g.appendChild(text);
      }
    }
  })();

  // ---- 스톱워치 로직 ----
  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('ms');
  const needle = document.getElementById('needle');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const lapBtn = document.getElementById('lapBtn');
  const resetBtn = document.getElementById('resetBtn');
  const lapsEl = document.getElementById('laps');
  const ledStart = document.getElementById('ledStart');
  const ledStop = document.getElementById('ledStop');
  const ledLap = document.getElementById('ledLap');
  const ledReset = document.getElementById('ledReset');

  let startTime = 0;
  let elapsed = 0;
  let timerId = null;
  let lapCount = 0;

  function formatTime(totalMs) {
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const centis = Math.floor((totalMs % 1000) / 10);

    const pad = (n, len = 2) => String(n).padStart(len, '0');
    return {
      main: `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`,
      ms: `.${pad(centis)}`
    };
  }

  function updateDisplay() {
    const current = elapsed + (timerId ? Date.now() - startTime : 0);
    const { main, ms } = formatTime(current);
    timeEl.textContent = main;
    msEl.textContent = ms;

    const secFraction = (current % 60000) / 60000;
    needle.setAttribute('transform', `rotate(${(secFraction * 360).toFixed(2)} 150 150)`);
  }

  function tick() {
    updateDisplay();
    timerId = requestAnimationFrame(tick);
  }

  function setLeds({ start, stop, lap, reset }) {
    ledStart.className = 'led' + (start ? ' on-green' : '');
    ledStop.className = 'led' + (stop ? ' on-red' : '');
    ledLap.className = 'led' + (lap ? ' on-blue' : '');
    ledReset.className = 'led' + (reset ? ' on-amber' : '');
  }

  function start() {
    startTime = Date.now();
    timerId = requestAnimationFrame(tick);
    startBtn.disabled = true;
    stopBtn.disabled = false;
    lapBtn.disabled = false;
    resetBtn.disabled = true;
    setLeds({ stop: true, lap: true });
  }

  function stop() {
    elapsed += Date.now() - startTime;
    cancelAnimationFrame(timerId);
    timerId = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    resetBtn.disabled = false;
    updateDisplay();
    setLeds({ start: true, reset: elapsed > 0 });
  }

  function reset() {
    elapsed = 0;
    lapCount = 0;
    timeEl.textContent = '00:00:00';
    msEl.textContent = '.00';
    needle.setAttribute('transform', 'rotate(0 150 150)');
    lapsEl.innerHTML = '';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    lapBtn.disabled = true;
    setLeds({ start: true });
  }

  function addLap() {
    lapCount++;
    const current = elapsed + (timerId ? Date.now() - startTime : 0);
    const { main, ms } = formatTime(current);
    const item = document.createElement('div');
    item.className = 'lap-item';
    item.innerHTML = `<span>LAP ${String(lapCount).padStart(2, '0')}</span><span>${main}${ms}</span>`;
    lapsEl.prepend(item);
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', reset);

  setLeds({ start: true });
</script>

</body>
</html>
